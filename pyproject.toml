[project]
name = "medmentor-ai-pro"
version = "1.0.0"
description = "Uzbek-language AI medical education Telegram bot + Mini App"
requires-python = ">=3.11"
dependencies = [
 "aiogram>=3.20,<4", "anthropic>=0.69,<2", "python-dotenv>=1,<2", "pydantic>=2,<3", "pydantic-settings>=2,<3",
 "aiosqlite>=0.20,<1", "PyMuPDF>=1.25,<2", "python-docx>=1.1,<2",
 "python-pptx>=1.0,<2", "Pillow>=11,<13", "fastapi>=0.115,<1",
 "uvicorn>=0.34,<1", "imageio-ffmpeg>=0.6,<1", "httpx>=0.28,<1", "tzdata>=2025.1"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["medmentor*"]
